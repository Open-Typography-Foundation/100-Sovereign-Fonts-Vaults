server {
    listen 80;
    server_name localhost;
    root /var/www/opentypography;
    index index.html font_browser.html;

    # Enable gzip compression for fast delivery of JSON, HTML, and SVG
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript font/ttf font/otf font/woff font/woff2 image/svg+xml;
    gzip_min_length 256;

    # Static font and asset caching
    location ~* \.(?:ttf|otf|woff|woff2|eot|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    # API endpoint for catalog data
    location /api/counts {
        alias /var/www/opentypography/vault_counts.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
